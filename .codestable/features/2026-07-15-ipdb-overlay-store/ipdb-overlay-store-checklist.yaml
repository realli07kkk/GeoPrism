  - item: "metadata 缺失/坏 JSON/错误版本/零 CreatedAt/Open 或 metadata corruption 各自触发唯一 quarantine 与 fresh DB"
    source: 验收场景
    status: passed
  - item: "普通错误、资源关闭失败和运行期 corruption 返回 error 且目录不变"
    source: 验收场景
    status: passed
  - item: "第二 owner 立即 ErrOverlayLocked 且目录不变；首 owner Close 后可重开；锁住的损坏库不 quarantine"
    source: 验收场景
    status: passed
  - item: "Close 两次安全；Close 后 Get/Put 返回 ErrOverlayClosed；并发调用不 panic、不误删新 Put"
