feature: 2026-06-22-ipdb-v2-query
created: 2026-06-22

steps:
  - action: "sentinel 错误 + BaseStore.LookupIP 真 LPM（store_v2.go）：定义 ErrLegacyFormat/ErrIncompleteSchema/ErrCorruptIndex 三个 sentinel；实现 BaseStore.LookupIP(addr netip.Addr) (Record, bool, error)——从 maxBits(addr) 递减到 0，逐前缀长度对 encodePrimaryKeyV2(PrefixFrom(addr, L).Masked()) 做 db.Get point 查，首个命中 decodeBaseRecordValueV2 + 据 primary key 还原 prefix 回填 Record.Network"
    exit_signal: "单测库含 10.0.0.0/8+10.1.0.0/16+10.1.2.0/24：LookupIP(10.1.2.3) 命中 /24（最长前缀）；LookupIP(10.1.5.5) 命中 /16；LookupIP(20.0.0.1) matched=false；命中结果 Record.Network 非空且回填正确"
    status: done

  - action: "BaseStore.LookupCIDR 三段查询（store_v2.go）：ancestors 段 L=0..query.Bits()-1，key=encodePrimaryKeyV2(PrefixFrom(query.Addr(), L).Masked())（对 query 起始地址逐 L mask，覆盖所有包含 query.Addr 的超集含起始<query 的情况）；self 段 cidr key 精确 Get；descendants 段 cidr 起始地址区间 [query.Addr(), queryLastAddr] 扫描 + prefixLen>=query.Bits() 过滤；每条 cidr 命中后回查 primary 取 value（cidr value 零长度）；cidr 有 primary 无 → ErrCorruptIndex（不静默跳过）；去重 + 按 encodeCIDRKeyV2 字节序排序（= startAddr 升序 + prefixLen 升序）"
    exit_signal: "库含 /8+/16+/24，LookupCIDR(10.1.2.0/24) 返回 3 条且排序确定；只含 /8+/16 的库 LookupCIDR(10.1.2.0/24) 返回 2 条（多层祖先，v1 Prev 漏 /8）；库含 1.0.0.0/24 查 1.0.0.128/25 返回 1 条 1.0.0.0/24（ancestors 捕获超集起始<query，防退化成纯 mask 链）；手工损坏库（删 primary 留 cidr）→ ErrCorruptIndex"
    status: done

  - action: "OpenCurrent 收口 + 过渡壳 Store（store.go）：OpenCurrent 自己读 CURRENT → ReadOnly pebble.Open（probe DB）→ 读 metadataKey 判 FormatVersion：!=2 关 probe DB → ErrLegacyFormat（仅此判定）；==2 关 probe DB → 调 openBaseV2（sanity 必过，二次打开无 lock 冲突）→ 检查 SchemaFeatures 缺 PrimaryLPM|CIDRStartIdx → 关库 ErrIncompleteSchema；metadata 读不到/损坏/lock → 关 probe DB 原样普通错误；Store 结构改持 *BaseStore，LookupIP/LookupCIDR/Metadata/Close 替换 v1 方法体为 delegation（签名零 diff，v1 方法体删除）；WriteRecord 改为显式返回写入失败 error（不依赖 s.db）"
    exit_signal: "OpenCurrent 打开 base-build 产出 v2 库 → *Store 可用、查询正确；打开 v1 库 → errors.Is(err, ErrLegacyFormat)；打开缺 capability 库 → ErrIncompleteSchema；打开空目录（无 metadata）→ 普通错误非 ErrLegacyFormat；任一错误路径后再 OpenCurrent 同目录不报 lock 冲突（probe DB 已关）；Store.WriteRecord 调用返回明确 error（非 panic、不依赖 s.db）；cli 5 调用点 grep 签名零 diff"
    status: done

  - action: "BuildFromCSV 收口 + currentFormatVersion 升级（builder.go + types.go）：BuildFromCSV 主体改调 buildV2FromCSV（一行 delegation）；types.go currentFormatVersion 从 byte=1 改 byte=2。与 step3 同 commit（原子切换，不出现能构建 v2 但程序不认 v2 的中间态）"
    exit_signal: "geoprism ipdb build --csv X 产 v2 库（Metadata.FormatVersion=2, SchemaFeatures=PrimaryLPM|CIDRStartIdx）；grep currentFormatVersion types.go 为 byte = 2；端到端 geoprism 10.1.2.3 命中正确最长前缀、geoprism 10.1.2.0/24 返回全部相交网段"
    status: done

  - action: "property test + benchmark + 质量门（store_v2_test.go 或合并）：property test 随机 prefix 集 + 暴力 oracle（单 IP 取 Bits() 最大的包含 prefix、CIDR 取全部相交）1000 次 fuzz，覆盖 /0、/32、/128、同起始不同 prefixLen、多父覆盖、完全相同 prefix 重复输入（应 reject）；benchmark IPv4/IPv6 冷热缓存 p50/p95 + 1/10/50 IP 批量；修正收口连带的既有测试断言（§3 已知需调整清单）；跑 go vet + gofmt -l + git diff --check + go test ./..."
    exit_signal: "property test 全绿（与暴力 oracle 一致）；benchmark 数据记录进 acceptance；§3 已知需调整的既有测试（TestBuildFromCSVRejectsOverlappingCIDR / TestOpenBaseV2RejectsV1Format / TestLookupCIDR / issue_writeback_fix_test v1 子测试 / cli buildTestIPDB 下游）全部修正或确认无需改；go vet ./... + gofmt -l + git diff --check + go test ./...（全仓含 cli 回归）全绿"
    status: done

