feature: 2026-06-22-ipdb-v2-schema
created: 2026-06-22

steps:
  - action: "类型层：在 types.go 新增 kind 字节常量（keyKindPrimaryV4/V6=0x14/0x16、keyKindCIDRV4/V6=0x24/0x26、keyKindOverlayV4/V6=0x34/0x36）+ SchemaFeatures 类型 + capability 常量（PrimaryLPM/CIDRStartIdx/预留 CIDRInlineValue）+ Metadata.SchemaFeatures 字段（json schema_features,omitempty）+ OverlayMeta 类型"
    exit_signal: "go build ./... 通过；go test ./backend/ipdb/... 全绿（v1 回归保护）；grep 确认 currentFormatVersion 仍为 1"
    status: done

  - action: "key 编解码：在 codec.go 新增 6 个 V2 key 函数（encode/decodePrimaryKeyV2、encode/decodeCIDRKeyV2、encode/decodeOverlayKeyV2）；v1 全部 6 个 codec 函数签名零 diff"
    exit_signal: "单测（建议落 codec_v2_test.go）覆盖 round-trip（V4/V6、/0 与 /32 与 /128 边界）+ primary↔cidr 互相还原不变量 + 异常（未 Masked / prefixLen 越界识别 Bits()==-1 / key 长度非法 / kind 字节未知）"
    status: done

  - action: "value 编解码：在 codec.go 新增 4 个 value 函数（encode/decodeBaseRecordValueV2 ver=2、encode/decodeOverlayRecordValueV1 ver=1）"
    exit_signal: "单测覆盖 round-trip（全字段/全空字段/Network 返回空）+ overlay OverlayMeta round-trip（含 expiresAtUnix==0 永不过期、FetchedAt 精确）+ 异常矩阵（version 不符 / flags 非零 / 截断 uvarint / 多余尾部字节）"
    status: done

  - action: "测试覆盖收口：补齐 roadmap §7 schema 异常输入矩阵 + schema_features JSON tag 行为单测 + capability 位运算单测"
    exit_signal: "第 3 节全部 24 条验收场景均有可观察证据"
    status: done

