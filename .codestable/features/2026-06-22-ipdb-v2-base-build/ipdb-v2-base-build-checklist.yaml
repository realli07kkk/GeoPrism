    status: passed
  - item: "错误：CSV 表头不符 / network 带 host bits / 相对路径 CSVPath → 各自明确 error（复用 v1 校验）"
    source: 验收场景
    status: passed
  - item: "错误（A）：CSV 含 IPv4-mapped IPv6（::ffff:10.0.0.0/112）→ v2 encode 拒绝向上传播，构建失败、不留目录/CURRENT（不静默跳过）"
    source: 验收场景
    status: passed
  - item: "错误（B）：构建注入失败后本次构建清理 .staging-{buildID}，versions/{buildID} 与 CURRENT 不存在；兜底清理仅限 crash 场景"
    source: 验收场景
    status: passed
  - item: "错误：openBaseV2 句柄 db.Set → 返回 error（base 运行期只读）"
    source: 验收场景
    status: passed
  - item: "错误（D）：openBaseV2 打开空 Pebble 目录（无 metadata key）→ fmt.Errorf 错误，不 panic"
